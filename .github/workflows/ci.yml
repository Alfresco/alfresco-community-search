name: Alfresco Search Community CI

on:
  pull_request:
    branches:
      - feature/**
      - fix/**
      - master
      - release/**
  push:
    branches:
      - master
      - release/**
  schedule:
    - cron: "0 12 * * 3"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_CLI_OPTS: "-B -e -fae -V -DinstallAtEnd=true -Dspring.main.banner-mode=off -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  MAVEN_SETTINGS_OPTS: "-s .github/empty-settings.xml -gs .github/empty-settings.xml"
  JAVA_VERSION: "17"
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  # Both variables are required to be set before the release process starts .
  # As the release is triggered by a commit message with "[release]" keyword on a release branch,
  # setting these variables to new values can be done in the same commit and will indicate the release and the dev versions in it.
  RELEASE_VERSION: "5.9.0-A.5"
  DEVELOPMENT_VERSION: "5.9.0-A.6-SNAPSHOT"

jobs:
  pre_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@567a9393acca033008ce34eafcb200469e4ea2f5 # v18.27.0

  build:
    name: "Build and test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: "Build and test"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} ${{ env.MAVEN_SETTINGS_OPTS }} clean verify

  release:
    name: "Release and deploy to Nexus"
    runs-on: ubuntu-latest
    needs: [pre_commit, build]
    if: >
      !(failure() || cancelled()) &&
      github.event_name != 'pull_request' &&
      github.ref_name == 'master' &&
      contains(github.event.head_commit.message, '[release]')
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      # Installs .ci.settings.xml, which maps the alfresco-public-* server ids
      # onto MAVEN_USERNAME / MAVEN_PASSWORD.
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@v18.27.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/configure-git-author@v18.27.0
        with:
          username: ${{ secrets.BOT_GITHUB_USERNAME }}
          email: ${{ secrets.BOT_GITHUB_EMAIL }}
      - name: "Release"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@v18.27.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ env.RELEASE_VERSION }}
          development-version: ${{ env.DEVELOPMENT_VERSION }}
