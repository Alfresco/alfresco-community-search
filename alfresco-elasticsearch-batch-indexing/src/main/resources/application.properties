## =====================================================================================
## Self-contained property set for the batch-indexing application.
## Spring Boot does NOT merge application.properties from dependency JARs, so every
## property required at startup must be defined here even if the reindexing module
## also defines it.
## =====================================================================================

## PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/alfresco
spring.datasource.username=alfresco
# pragma: allowlist nextline secret
spring.datasource.password=alfresco
spring.datasource.hikari.maximumPoolSize=20
alfresco.dbType=

## Spring Batch (ephemeral in-memory DB)
spring.main.allow-bean-definition-overriding=true
spring.batch.job.enabled=false
spring.batch.initialize-schema=always
spring.batch.datasource.url=jdbc:hsqldb:mem:batch
spring.batch.datasource.username=SA
# pragma: allowlist nextline secret
spring.batch.datasource.password=SA
spring.batch.datasource.driver-class-name=org.hsqldb.jdbcDriver
spring.batch.drop.script=classpath:/org/springframework/batch/core/schema-drop-hsqldb.sql
spring.batch.schema.script=classpath:/org/springframework/batch/core/schema-hsqldb.sql

## Elasticsearch
elasticsearch.indexName=alfresco

## Mediation filter
alfresco.mediation.filter-file=classpath:mediation-filter.yml
alfresco.reindex.prefixes-file=classpath:reindex.prefixes-file.json

## Reindex job settings
## Blank = continuous (scheduler-driven, the default). Set to a one-shot job name:
## reindexByDate / reindexByIds / reindexDlq - to run that job once and exit
## (scheduler suppressed; see OneShotJobRunner). Matches the enterprise reindexing
## app's alfresco.reindex.jobName so the value migrates across verbatim.
alfresco.reindex.jobName=
## Defaults reflect bulk-reindex shape: large batches amortise per-call cost;
## the multi-threaded step then spreads chunks across concurrentProcessors
## worker threads. Tune down for very small live windows if needed.
alfresco.reindex.batchSize=1000
alfresco.reindex.pagesize=1000
alfresco.reindex.concurrentProcessors=10
alfresco.reindex.fromId=0
alfresco.reindex.toId=20000000000
alfresco.reindex.fromTime=190001010000
alfresco.reindex.toTime=203012312359

## Multi-threaded step on by default for this app. Spring Batch chunk retry
## (enabled via retryingEnabled=true below) coexists with the multi-threaded
## step under master's StepConfigurer; the per-thread serialisation cost is
## acceptable here in exchange for the transient-failure resilience we want
## for continuous polling.
alfresco.reindex.multithreadedStepEnabled=true

## Retry: applies to the metadata-repository AOP proxy (reader-side) and to
## the Spring Batch chunk via StepConfigurer. Same exponential-backoff knobs
## drive both layers. writerRetry* parameterise ElasticsearchPathWriter's
## per-bulk internal retry against ES.
alfresco.reindex.retryingEnabled=true
alfresco.reindex.retryingMaxCount=3
alfresco.reindex.retryingInitialDelay=1000
alfresco.reindex.retryingDelayIntervalMultiplier=2
alfresco.reindex.retryingMaxDelay=30000
alfresco.reindex.writerRetryDelay=1000
alfresco.reindex.writerRetryCount=3

## Writer strategy. Batch-indexing always runs sequentially (see docs/reindex-writer-configuration.md);
## pinned explicitly here, independent of the reindexing module's concurrent default.
alfresco.reindex.writerMode=sequential

## Step-level skip cap. Once a run skips more items than this, the step
## fails. The reindexing module defaults this to 0 (skip disabled) so
## enterprise consumers keep fail-on-poison-item; batch-indexing opts
## in here because a single poison node must not stall continuous
## indexing. The give-up event is surfaced via a SkipListener bean
## (DlqSkipListener) if one is present.
alfresco.reindex.skipLimit=100

## Node whose type namespace has no prefix mapping. The loss is reported and recorded in the
## dead-letter index either way; this only decides whether indexing carries on.
##   filter - drop the node and keep going (Spring Batch counts it as filtered)
##   skip   - fail the item, so it counts as skipped and alfresco.reindex.skipLimit applies
##   stop   - fail the item without skipping it, ending the application; indexing stops for the
##            whole repository until the prefix map is fixed
alfresco.reindex.onUnresolvedNamespace=filter

## Dead-letter queue. Records each give-up event in a dedicated ES index
## so operators have an audit trail that survives log rotation and
## container restarts. Best-effort writes; a broken DLQ never blocks
## indexing (write errors are rate-limited to one per minute per failure
## type). Disable via enabled=false; the SkipListener hook then no-ops.
alfresco.reindex.dead-letter.enabled=true
alfresco.reindex.dead-letter.indexName=alfresco-reindex-dead-letter

## reindexDlq one-shot drain. deleteOnSuccess clears an entry once its node
## reindexes without a fresh failure; maxItems caps the per-run scan (a
## warning is logged if the cap is hit).
alfresco.reindex.recovery.dlq.deleteOnSuccess=true
alfresco.reindex.recovery.dlq.maxItems=10000

## Alfresco Repository Database
alfresco.db.minimum.schema.version=14002

## Accepted content media types cache
alfresco.accepted-content-media-types-cache.base-url=http://localhost:8090/transform/config
alfresco.accepted-content-media-types-cache.enabled=true
alfresco.accepted-content-media-types-cache.retry-max-attempts=5

## Indexing toggles
alfresco.reindex.metadataIndexingEnabled=true
alfresco.reindex.contentIndexingEnabled=true
alfresco.reindex.pathIndexingEnabled=true
alfresco.reindex.pathCacheSize=10000

## Tag configuration
alfresco.reindex.failOnMissingTag=true
alfresco.reindex.addEmptyTagAttribute=true
alfresco.reindex.removeTaggableAttribute=true

alfresco.cache.timeout.seconds=120

## Elasticsearch sniffer (disabled when running locally since sniffer will replace address with ES container IP)
spring.elasticsearch.restclient.sniffer.enabled=false

## Continuous reindexing mode (live indexing via polling)
alfresco.reindex.continuous.pollingInterval=30s
alfresco.reindex.continuous.maxPollingInterval=5m
alfresco.reindex.continuous.catchUpPollingInterval=1s
alfresco.reindex.continuous.overlap=10m
alfresco.reindex.continuous.watermarkIndexName=alfresco-reindex-state
alfresco.reindex.continuous.maxWindow=30m
alfresco.reindex.continuous.maxGapAge=24h
alfresco.reindex.continuous.watermarkRetryMaxAttempts=3
alfresco.reindex.continuous.watermarkRetryDelay=2s
alfresco.reindex.continuous.autoStart=true

## Smart-seed, opt-in. On an empty watermark, seed the cursor from the DB's
## earliest node commit time (instead of bootstrapFromAlfrescoIndex's ES-max
## based seed) so normal catch-up walks forward and backfills everything.
## Pair with maxGapAge=0 for a full backfill.
alfresco.reindex.continuous.seedFromEarliest=false

## Liveness watchdog: how long the scheduler may be silent (no cycle start, no chunk
## commit, no cycle finish) before the /actuator/health/liveness endpoint reports DOWN
## and Kubernetes restarts the pod. Must be greater than worst-case single-chunk
## wall-clock time so that a legitimate exponential backoff after failures does not
## trigger a spurious DOWN.
alfresco.reindex.continuous.stuckThreshold=10m
## Report DOWN after this many consecutive failed cycles. 0 disables.
alfresco.reindex.continuous.unhealthyAfterConsecutiveFailures=3

## Content transform (direct HTTP to ACS)
## alfresco.repository.url: ACS base URL INCLUDING the webapp context path.
## The fixed service path is appended to it. Defaults to http://localhost:8080/alfresco.
## To use a custom service path, set alfresco.content.transform.urlPath TOGETHER with
## alfresco.repository.url. Setting urlPath on its own is treated as the deprecated form below.
#alfresco.repository.url=http://localhost:8080/alfresco
#alfresco.content.transform.urlPath=/service/api/solr/textContent
#
## DEPRECATED (use alfresco.repository.url): alfresco.acs.url is the host WITHOUT the context, with the context embedded
# in alfresco.content.transform.urlPath. Still honored (logs a warning). Do NOT combine with alfresco.repository.url
# the app stops if both are set.
#alfresco.acs.url=http://localhost:8080
#alfresco.content.transform.urlPath=/alfresco/service/api/solr/textContent

alfresco.content.transform.timeout=20s
alfresco.content.transform.retryMaxAttempts=2
alfresco.content.transform.retryDelay=1s
alfresco.content.transform.sharedSecret=

## Per-chunk parallelism for content fetch from ACS. 1 = serial (legacy).
## Sized to roughly match transform-core-aio's effective worker count;
## tune up if ACS+transform are not saturated and the indexer is the
## bottleneck.
alfresco.content.transform.writeConcurrency=16

## Caps how many of the most-recent reindex job executions keep their per-job metrics.
## Continuous batch-indexing starts a new Spring Batch job every polling cycle, so retaining
## every job's meters would grow the heap without bound; only the most recent N are kept.
## Set to 0 (or a negative value) to disable the cap and retain all jobs (unbounded).
alfresco.metrics.reindex.max-retained-jobs=50

server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus,metrics

## Liveness / readiness probes. The continuous reindexing monitor (bean name
## `continuousReindexingMonitor`) is added to the liveness group so a stuck scheduler
## causes Kubernetes to restart the pod. Readiness stays on the default set.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,continuousReindexingMonitor
management.endpoint.health.show-details=never
