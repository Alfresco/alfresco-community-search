name: Alfresco Search Community CI

on:
  pull_request:
    branches:
      - feature/**
      - fix/**
      - master
      - release/**
  push:
    branches:
      - master
      - release/**
  schedule:
    - cron: "0 12 * * 3"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_CLI_OPTS: "-B -e -fae -V -DinstallAtEnd=true -Dspring.main.banner-mode=off -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  MAVEN_SETTINGS_OPTS: "-s .github/empty-settings.xml -gs .github/empty-settings.xml"
  JAVA_VERSION: "17"
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  # Both variables are required to be set before the release process starts .
  # As the release is triggered by a commit message with "[release]" keyword on a release branch,
  # setting these variables to new values can be done in the same commit and will indicate the release and the dev versions in it.
  DEVELOPMENT_VERSION: "5.10.0-A.6-SNAPSHOT" # The version that will be set in pom files after the release (next dev version)
  RELEASE_VERSION: "5.10.0-A.5"

jobs:
  pre_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0

  test_run_check:
    name: "Test run check"
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.check.outputs.tests }}
    steps:
      - id: check
        run: |
          echo "tests=true" >> "$GITHUB_OUTPUT"
        if: >
          (
            (github.ref_name == 'master' || startsWith(github.ref_name, 'release/') || github.event_name == 'pull_request') &&
            !contains(github.event.head_commit.message, '[skip build]') &&
            !contains(github.event.head_commit.message, '[skip tests]')
          ) ||
          contains(github.event.head_commit.message, '[run tests]')

  pmd_scan:
    name: "PMD Scan"
    runs-on: ubuntu-latest
    needs: [ test_run_check ]
    if: needs.test_run_check.outputs.tests == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/ya-pmd-scan@1f36f8e45695ce60362010345a99a0c8f7310264 # v4.4.1
        with:
          create-github-annotations: "false"

  build:
    name: "Build and test"
    runs-on: ubuntu-latest
    needs: [ pre_commit, test_run_check ]
    if: needs.test_run_check.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: "Build and test"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} ${{ env.MAVEN_SETTINGS_OPTS }} clean verify
      - name: "Check attribution notice"
        run: python3 scripts/generate-notice.py

  batch_indexing_e2e:
    name: "Batch Indexing E2E"
    runs-on: ubuntu-latest
    needs: [ pre_commit, test_run_check ]
    if: needs.test_run_check.outputs.tests == 'true'
    steps:
      # No registry login: every image this stack pulls is public, which is what lets a
      # fork pull request run the whole suite with no secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Build application"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} ${{ env.MAVEN_SETTINGS_OPTS }} clean install -DskipTests -P docker-image
      - name: "Build docker images"
        run: bash ./scripts/ci/buildDockerImagesCi.sh
        env:
          COMMIT_MESSAGE: ${{ github.sha }}
      - name: "Run BatchIndexingDockerComposeIT"
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} ${{ env.MAVEN_SETTINGS_OPTS }} verify -Dlogging.root.level=off \
            -pl alfresco-elasticsearch-batch-indexing-distribution \
            -P docker-compose-test
      - name: "Dump all Docker containers logs"
        if: failure()
        uses: Alfresco/alfresco-build-tools/.github/actions/docker-dump-containers-logs@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  batch_indexing_reliability_tests:
    strategy:
      fail-fast: false
      matrix:
        tests:
          - name: "Capacity"
            params: '"-Dit.test=CapacityReliabilityIT.java"'
          - name: "Capacity With Content"
            params: '"-Dit.test=CapacityWithContentReliabilityIT.java"'
          - name: "Memory"
            params: '"-Dit.test=MemoryReliabilityIT.java"'
          - name: "Lifecycle"
            params: '"-Dit.groups=lifecycle"'
          - name: "Infra Recovery"
            params: '"-Dit.groups=infra-recovery"'
          - name: "Poison"
            params: '"-Dit.groups=poison"'
          - name: "Large Single Window"
            params: '"-Dit.test=LargeSingleWindowIT.java"'
    name: "Batch Indexing Reliability - ${{ matrix.tests.name }}"
    runs-on: ubuntu-latest
    needs: [ pre_commit, test_run_check ]
    if: needs.test_run_check.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Build application"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} ${{ env.MAVEN_SETTINGS_OPTS }} clean install -DskipTests -P docker-image
      - name: "Build docker images"
        run: bash ./scripts/ci/buildDockerImagesCi.sh
        env:
          COMMIT_MESSAGE: ${{ github.sha }}
      - name: "Run reliability IT"
        run: |
          mvn ${{ env.MAVEN_CLI_OPTS }} ${{ env.MAVEN_SETTINGS_OPTS }} verify -Dlogging.root.level=off \
            -pl alfresco-elasticsearch-batch-indexing-distribution \
            -P reliability-tests ${{ matrix.tests.params }}
        env:
          RELIABILITY_TESTS: true
      - name: "Dump all Docker containers logs"
        if: failure()
        uses: Alfresco/alfresco-build-tools/.github/actions/docker-dump-containers-logs@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
      - name: "Upload reliability output"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reliability-${{ matrix.tests.name }}-${{ github.run_attempt }}
          path: |
            alfresco-elasticsearch-batch-indexing-distribution/target/reliability/**
            alfresco-elasticsearch-batch-indexing-distribution/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  release:
    name: "Release and deploy to Nexus and S3 Staging Bucket"
    runs-on: ubuntu-latest
    needs: [ pre_commit, build, batch_indexing_e2e, batch_indexing_reliability_tests ]
    permissions:
      id-token: write
      contents: read
    if: >
      !(failure() || cancelled()) &&
      github.event_name != 'pull_request' &&
      (github.ref_name == 'master' || startsWith(github.ref_name, 'release/')) &&
      contains(github.event.head_commit.message, '[release]')
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      # Fail before the release starts rather than half-way through: a missing bucket makes
      # the upload target "s3://" and the release completes with nothing published.
      - name: "Check the S3 variables are set"
        run: |
          missing=""
          [ -n "${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}" ] || missing="$missing AWS_STAGING_ARTIFACT_UPLOAD_BUCKET"
          [ -n "${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_REGION }}" ] || missing="$missing AWS_STAGING_ARTIFACT_UPLOAD_REGION"
          [ -n "${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_ROLE_ARN }}" ] || missing="$missing AWS_STAGING_ARTIFACT_UPLOAD_ROLE_ARN"
          [ -n "${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_BUCKET }}" ] || missing="$missing AWS_RELEASE_ARTIFACT_UPLOAD_BUCKET"
          [ -n "${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_REGION }}" ] || missing="$missing AWS_RELEASE_ARTIFACT_UPLOAD_REGION"
          [ -n "${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_ROLE_ARN }}" ] || missing="$missing AWS_RELEASE_ARTIFACT_UPLOAD_ROLE_ARN"
          if [ -n "$missing" ]; then
            echo "::error::Org variables not visible to this repository:$missing"
            exit 1
          fi
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      # Installs .ci.settings.xml, which maps the alfresco-public-* server ids
      # onto MAVEN_USERNAME / MAVEN_PASSWORD.
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/configure-git-author@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          username: ${{ secrets.BOT_GITHUB_USERNAME }}
          email: ${{ secrets.BOT_GITHUB_EMAIL }}
      - name: "Release"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ env.RELEASE_VERSION }}
          development-version: ${{ env.DEVELOPMENT_VERSION }}
      # Same S3 layout the connector used to publish this artifact under, so the
      # download URL does not change when publication moves here.
      - run: mkdir -p deploy_dir/community/alfresco-elasticsearch-batch-indexing/${{ env.RELEASE_VERSION }}
      - name: "Move the distribution zip into deploy_dir"
        run: |
          mv "alfresco-elasticsearch-batch-indexing-distribution/target/alfresco-elasticsearch-batch-indexing-distribution-${{ env.RELEASE_VERSION }}.zip" \
             "deploy_dir/community/alfresco-elasticsearch-batch-indexing/${{ env.RELEASE_VERSION }}/"
      - name: "Clone Alfresco/third-party-license-overrides"
        run: git clone --depth=1 https://github.com/Alfresco/third-party-license-overrides.git
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: "Create third party license csv file and add it to the deploy directory"
        run: |
          python3 ./third-party-license-overrides/thirdPartyLicenseCSVCreator.py \
            --project "${{ github.workspace }}" \
            --version "${{ env.RELEASE_VERSION }}" --combined \
            --output "deploy_dir/community/alfresco-elasticsearch-batch-indexing/${{ env.RELEASE_VERSION }}"
      - name: "Deploy to S3 Staging Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          aws-region: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_ROLE_ARN }}
          destination: s3://${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}
          source: ./deploy_dir
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  deploy_release_docker_image:
    name: "Deploy release image to Docker Hub"
    runs-on: ubuntu-latest
    needs: [ pre_commit, build, batch_indexing_e2e, batch_indexing_reliability_tests ]
    if: >
      !(failure() || cancelled()) &&
      github.event_name != 'pull_request' &&
      (github.ref_name == 'master' || startsWith(github.ref_name, 'release/')) &&
      contains(github.event.head_commit.message, '[release]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Docker Hub only. The batch-indexing image is public; nothing here goes to quay.io.
      - name: "Login to Docker Hub"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Set release version"
        run: mvn versions:set -DnewVersion=${{ env.RELEASE_VERSION }}
      # The docker-image profile stages the Dockerfile under target/classes, which is
      # where the release script looks for it.
      - name: "Build application"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} ${{ env.MAVEN_SETTINGS_OPTS }} clean install -DskipTests -P docker-image
      - name: "Revert release version"
        run: mvn versions:revert
      - name: "Push release image to Docker Hub"
        run: bash ./scripts/ci/releaseDockerImage.sh -v ${{ env.RELEASE_VERSION }}
        env:
          COMMIT_MESSAGE: ${{ github.sha }}
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  deploy_release:
    name: "Copy to S3 Downloads Bucket"
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      id-token: write
      contents: read
    if: >
      !(failure() || cancelled()) &&
      github.event_name != 'pull_request' &&
      (github.ref_name == 'master' || startsWith(github.ref_name, 'release/')) &&
      contains(github.event.head_commit.message, '[release]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Alphas stage but never reach the downloads bucket; only x.y.z(.n) is a real release.
      - name: "Check release version"
        id: check-release-version
        run: |
          if [[ ${{ env.RELEASE_VERSION }} =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Copy community release to S3 Downloads Bucket"
        if: steps.check-release-version.outputs.is-release == 'true'
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          aws-region: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_ROLE_ARN }}
          destination: s3://${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_BUCKET }}/release/community/alfresco-elasticsearch-batch-indexing/${{ env.RELEASE_VERSION }}
          source: s3://${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}/community/alfresco-elasticsearch-batch-indexing/${{ env.RELEASE_VERSION }}/
          copy-props: none
