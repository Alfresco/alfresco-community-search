name: "Load Dependency Graph"

on:
  push:
    branches:
      - "master"
      - "release/**"
  schedule:
    - cron: '0 6 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  scan-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/maven-dependency-scan@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          java-version: '17'
          maven-version: '3.9.9'
          maven-args: -Dscopes=compile,runtime
          maven-settings-path: ".ci.settings.xml"
