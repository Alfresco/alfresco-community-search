services:
  postgres:
    image: postgres:16.5
    mem_limit: 512m
    environment:
      POSTGRES_PASSWORD: alfresco  # pragma: allowlist secret
      POSTGRES_USER: alfresco
      POSTGRES_DB: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ${ALFRESCO_DUMP_SQL_PATH}:/docker-entrypoint-initdb.d/alfresco-dump.sql:ro

  elasticsearch:
    image: elasticsearch:8.17.3
    mem_limit: 2g
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -q '\\(green\\|yellow\\)'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  batch-indexing:
    image: alfresco/alfresco-elasticsearch-batch-indexing:${BATCH_INDEXING_TAG}
    pull_policy: never
    mem_limit: 1g
    environment:
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alfresco
      SPRING_DATASOURCE_USERNAME: alfresco
      SPRING_DATASOURCE_PASSWORD: alfresco # pragma: allowlist secret
      SPRING_ELASTICSEARCH_REST_URIS: http://elasticsearch:9200
      ELASTICSEARCH_INDEXNAME: alfresco
      # Tight polling so a lifecycle test doesn't wait 30s for the first cycle.
      # Anything a lifecycle test needs to vary is interpolated with a default
      # that suits the common case; individual ITs override via withEnv(...).
      ALFRESCO_REINDEX_CONTINUOUS_POLLINGINTERVAL: ${LIFECYCLE_POLLING_INTERVAL:-2s}
      ALFRESCO_REINDEX_CONTINUOUS_MAXPOLLINGINTERVAL: ${LIFECYCLE_MAX_POLLING_INTERVAL:-5s}
      ALFRESCO_REINDEX_CONTINUOUS_OVERLAP: ${LIFECYCLE_OVERLAP:-30s}
      ALFRESCO_REINDEX_CONTINUOUS_MAXWINDOW: ${LIFECYCLE_MAX_WINDOW:-24h}
      ALFRESCO_REINDEX_CONTINUOUS_MAXGAPAGE: ${LIFECYCLE_MAX_GAP_AGE:-0s}
      # Content indexing off so we don't need transform-core-aio for lifecycle scenarios
      ALFRESCO_REINDEX_CONTENTINDEXINGENABLED: "false"
    volumes:
      - ${POSTGRES_DRIVER_PATH}:/opt/db-drivers/postgresql.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
