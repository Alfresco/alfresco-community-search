name: Alfresco Search Community CI

on:
  pull_request:
    branches:
      - feature/**
      - fix/**
      - master
      - release/**
  push:
    branches:
      - feature/**
      - fix/**
      - master
      - release/**
  schedule:
    - cron: "0 12 * * 3"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_CLI_OPTS: "-B -e -fae -V -DinstallAtEnd=true -Dspring.main.banner-mode=off -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  MAVEN_SETTINGS_OPTS: "-s .github/empty-settings.xml -gs .github/empty-settings.xml"
  JAVA_VERSION: "17"

jobs:
  pre_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v18.19.1

  build:
    name: "Build and test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - name: "Build and test"
        run: mvn ${{ env.MAVEN_CLI_OPTS }} ${{ env.MAVEN_SETTINGS_OPTS }} clean verify
